name: Bump add-on version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    # Prevent infinite loop when this workflow pushes the bump commit
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      did_bump: ${{ steps.commit.outputs.did_bump }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump add-on version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('homeassistantagent/config.json')
          data = json.loads(config_path.read_text())
          version = data.get('version', '0.0.0')
          parts = version.split('.')
          while len(parts) < 3:
            parts.append('0')
          major, minor, patch = (int(parts[0]), int(parts[1]), int(parts[2]))
          patch += 1
          data['version'] = f"{major}.{minor}.{patch}"
          config_path.write_text(json.dumps(data, indent=2) + "\n")
          print(f"Bumped version to {data['version']}")
          PY

      - name: Commit version bump
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            echo "did_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homeassistantagent/config.json
          git commit -m "chore: bump add-on version"
          git push origin HEAD:main
          echo "did_bump=true" >> "$GITHUB_OUTPUT"

  notify_ha:
    name: Notify Home Assistant
    runs-on: ubuntu-latest
    needs: bump-version
    # Only ever notify for trusted "push to main" events, and only if we actually bumped.
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.bump-version.outputs.did_bump == 'true'
    permissions:
      contents: read
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Read bumped version from main (via GitHub API)
        id: bumped_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json, base64, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/contents/homeassistantagent/config.json?ref=main"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "gha",
              },
          )
          with urllib.request.urlopen(req) as r:
            payload = json.loads(r.read().decode("utf-8"))

          raw = base64.b64decode(payload["content"]).decode("utf-8")
          data = json.loads(raw)
          print(f"version={data.get('version','')}")
          PY

      - name: Call HA webhook
        run: |
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "'"${GITHUB_REPOSITORY}"'",
              "workflow": "'"${GITHUB_WORKFLOW}"'",
              "run_id": "'"${GITHUB_RUN_ID}"'",
              "run_number": "'"${GITHUB_RUN_NUMBER}"'",
              "sha": "'"${GITHUB_SHA}"'",
              "ref": "'"${GITHUB_REF}"'",
              "bump_job_result": "'"${{ needs['bump-version'].result }}"'",
              "bumped_version": "'"${{ steps.bumped_version.outputs.version }}"'"
            }' \
            "${{ secrets.HA_WEBHOOK_URL }}"
